# Launcher icons for every platform, generated with:
#   dart run flutter_launcher_icons
#
# Sources live in assets/icon/ and are derived from assets/akili_icon_512.png:
#   *_master_1024      full-bleed gradient + glyph (iOS/macOS mask it themselves,
#                      so it must NOT carry the source's own rounded corners)
#   *_ios_1024         same, with the alpha channel stripped (App Store rejects alpha)
#   *_adaptive_*       Android 8+ two-layer icon; the foreground is fitted to the
#                      66dp safe circle so round launcher masks cannot clip the glyph
flutter_launcher_icons:
  image_path: "assets/icon/akili_icon_master_1024.png"

  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/akili_adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/akili_adaptive_foreground.png"
  # Android 13+ themed icons: the system tints this by its alpha channel.
  adaptive_icon_monochrome: "assets/icon/akili_adaptive_foreground.png"

  ios: true
  image_path_ios: "assets/icon/akili_icon_ios_1024.png"
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/icon/akili_icon_ios_1024.png"

  web:
    generate: true
    image_path: "assets/icon/akili_icon_master_1024.png"
    background_color: "#0f8cff"
    theme_color: "#3e5fff"

  windows:
    generate: true
    image_path: "assets/icon/akili_icon_master_1024.png"
    icon_size: 256
