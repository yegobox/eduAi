name: Release Android (Play Store)

on:
  # Manual releases: pick the track you want to ship to.
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane"
        required: true
        default: "internal"
        type: choice
        options:
          - build_only
          - internal
          - beta
          - production
          - promote_to_production
  # Every push, on any branch, ships to the internal track; android-v* tags do too.
  push:
    branches:
      - "**"
    tags:
      - "android-v*"

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  play-deploy:
    name: "Build & upload to Google Play"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Write compile-time config (env.json)
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -z "$ENV_JSON" ]; then
            echo "::error::ENV_JSON secret is not set - the release build has no Supabase/MoMo config."
            exit 1
          fi
          printf '%s' "$ENV_JSON" > env.json
          # Fail fast on a malformed secret rather than deep inside the Dart build.
          python3 -c "import json,sys; json.load(open('env.json'))"

      - name: Write Firebase config (google-services.json)
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_JSON" ]; then
            echo "::warning::GOOGLE_SERVICE_JSON not set - Firebase phone auth will be inactive in this build."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_JSON" > android/app/google-services.json
          python3 tool/validate_google_services.py

      - name: Configure upload keystore
        working-directory: android
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          # An empty alias or password produces an unsigned/garbled AAB that Play
          # rejects only after the upload, so check up front.
          missing=""
          for name in PLAY_STORE_UPLOAD_KEY KEYSTORE_KEY_ALIAS KEYSTORE_KEY_PASSWORD KEYSTORE_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            exit 1
          fi
          # Strip any stray whitespace/CR from the pasted secret before decoding;
          # GNU base64 rejects CR outright with "invalid input".
          if ! printf '%s' "$PLAY_STORE_UPLOAD_KEY" | tr -d '[:space:]' | base64 --decode > app/key.jks; then
            echo "::error::PLAY_STORE_UPLOAD_KEY is not valid base64. Set it with: base64 -i android/app/key.jks | gh secret set PLAY_STORE_UPLOAD_KEY -R $GITHUB_REPOSITORY"
            exit 1
          fi
          # A JKS/PKCS12 keystore starts with 0xFEEDFEED or 0x30 - catch a raw
          # (un-encoded) upload before the confusing keytool error.
          if [ ! -s app/key.jks ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "storeFile=key.jks" > key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
          keytool -list -keystore app/key.jks -alias "$KEYSTORE_KEY_ALIAS" \
            -storepass "$KEYSTORE_STORE_PASSWORD" > /dev/null \
            || { echo "::error::Keystore does not open with the supplied alias/password."; exit 1; }

      - name: Set up Fastlane
        uses: ruby/setup-ruby@v1
        with:
          # fastlane 2.238 warns on Ruby < 3.3 and will require 3.3+ soon.
          # The bundler version comes from android/Gemfile.lock (BUNDLED WITH).
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: android

      # The runner image ships a set of platforms that lags the newest API; the
      # build needs android-37 for flutter_secure_storage 11.
      - name: Ensure Android SDK platform 37
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Calculate version
        run: |
          # Monotonic across runs; the manual first upload used versionCode 1.
          VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - run: flutter pub get

      # First release only: Play's API cannot create an app or make its first
      # upload, so build the signed AAB here and upload it by hand in the Console.
      - name: Build signed AAB (no upload)
        if: github.event.inputs.lane == 'build_only'
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: flutter build appbundle --release --dart-define-from-file=env.json

      - name: Fastlane deploy
        if: github.event.inputs.lane != 'build_only'
        working-directory: android
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAYSTORE_ACCOUNT_KEY }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          # fastlane refuses to run reliably without a UTF-8 locale.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          if [ -z "$PLAY_STORE_CONFIG_JSON" ]; then
            echo "::error::PLAYSTORE_ACCOUNT_KEY is not set - cannot talk to the Play API."
            exit 1
          fi
          bundle exec fastlane ${{ github.event.inputs.lane || 'internal' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eduai-android-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            build/app/outputs/bundle/**/*.aab
            build/app/outputs/mapping/**/*.txt
